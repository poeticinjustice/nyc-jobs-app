name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch supersedes the previous run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server + shared tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Coverage thresholds are configured per-area in jest.config.js and fail
      # the build on a regression.
      # The npm script pins TZ, but set it here too so a runner default can
      # never silently put the date tests back into UTC — the one zone where
      # a date-only off-by-one is invisible.
      - name: Run server and shared tests with coverage
        run: npm run test:server:coverage
        env:
          TZ: America/New_York

      - name: Upload coverage report
        if: matrix.node-version == '22.x'
        uses: actions/upload-artifact@v4
        with:
          name: server-coverage
          path: coverage/
          retention-days: 7

  client:
    name: Web client lint, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      # The client imports the shared package via a file: dependency, so the
      # root install has to happen first.
      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Lint
        run: npx eslint src/
        working-directory: client

      - name: Test
        run: npm run test:ci
        working-directory: client
        env:
          CI: true

      - name: Build
        run: npm run build
        working-directory: client
        env:
          CI: true

  mobile:
    name: Mobile typecheck, lint, test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci
        working-directory: apps/mobile

      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: apps/mobile

      - name: Lint
        run: npx eslint .
        working-directory: apps/mobile

      - name: Test
        run: npm run test:ci
        working-directory: apps/mobile
        env:
          CI: true
