services:
  - type: web
    name: nyc-jobs-app
    runtime: node
    buildCommand: npm install && cd client && npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/jobs/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      # Public site URL, used for links in saved-search alert emails
      - key: APP_URL
        value: https://nyc-jobs-app.onrender.com
      # Optional SMTP config for alert emails — set in the Render dashboard.
      # Unset means alerts stay in-app only.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: ALERT_FROM_EMAIL
        sync: false
      - key: NYC_JOBS_API_URL
        value: https://data.cityofnewyork.us/resource/kpav-sd4t.json
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 600
      - key: USAJOBS_API_KEY
        sync: false
      - key: USAJOBS_EMAIL
        sync: false
      - key: USAJOBS_BASE_URL
        value: https://data.usajobs.gov/api/Search
